services:
  extraction:
    extends:
      file: extraction-compose.yaml
      service: extraction

  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgdata2:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  fastapi:
    build: .
    group_add:
      - '10001'
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-500}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - extraction-socket:/socket:ro
    depends_on:
      db:
        condition: service_started
      extraction:
        condition: service_healthy
    env_file:
      - .env

volumes:
  extraction-socket:
  pgdata2:
